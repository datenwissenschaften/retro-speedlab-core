name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    defaults:
      run:
        working-directory: retro-speedlab-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: retro-speedlab-core

      - uses: actions/checkout@v4
        with:
          repository: datenwissenschaften/retro-speedlab-engine
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: retro-speedlab-engine

      - uses: astral-sh/setup-uv@v6

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install the vision extra for CPU
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
          uv pip install stable-baselines3==2.9.2

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test (pytest)
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: retro-speedlab-core/coverage.xml
          fail_ci_if_error: true
